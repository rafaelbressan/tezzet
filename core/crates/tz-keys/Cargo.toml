[package]
name = "tz-keys"
description = "SPEC-0001 §1 `tz-keys`: identidade da chave. Deterministico, sem estado, nao toca disco nem sistema operacional."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tz-params = { workspace = true }
zeroize = { workspace = true }
constant_time_eq = { workspace = true }

# §12.1 — declaracao verificada empiricamente pela especificacao: com
# `default-features = false` a `Mnemonic` **deixa de ser** serializavel, e com
# `zeroize` ela zera no drop. Ligar `std` reintroduz `serde` sem ninguem
# escrever uma linha errada. Nao ligar.
bip39 = { version = "=2.2.2", default-features = false, features = ["zeroize", "alloc"] }

# NFKD da §4.2. Entrou no caminho da chave por decisao de revisao registrada em
# `docs/spec/0001` (§12.1 diz que acrescentar dependencia aqui e decisao de
# revisao): unicode-rs, commit 2025-11-03, passa o criterio P4 pelo braco do
# release. A alternativa era recusar passphrase BIP-39 nao-ASCII, o que perde
# carteira alheia legitima; reimplementar NFKD esta fora de questao.
unicode-normalization = { version = "=0.1.25", default-features = false }

sha2 = { version = "=0.11.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
blake2 = { version = "=0.11.0", default-features = false }
base58ck = { version = "=0.5.0", default-features = false, features = ["alloc"] }

ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }

[dev-dependencies]
hex = "=0.4.3"
trybuild = "=1.0.120"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[features]
# §9.6 — expoe os bytes crus do escalar para o varredor de memoria do CI
# procurar exatamente eles. **Nunca em build de producao**; o portao
# `tezos-core/tests/portoes_de_codigo.rs` reprova se ela aparecer numa
# dependencia de producao.
memscan-gate = []
