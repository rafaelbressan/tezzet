[package]
name = "tezzet"
version = "0.1.0"
description = "Tezzet — carteira Tezos. Primeira onda: leitura e Beacon, sem custódia."
authors = ["Tezos.Rio"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# O sufixo `_lib` evita colisão com o nome do binário no Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "tezzet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# NENHUMA dependência de criptografia aqui, e isso é deliberado.
#
# Esta onda não guarda chave: quem assina é a carteira do usuário, pelo
# Beacon. As crates de chave (`ed25519-dalek`, `bip39`, `argon2`, ...) entram
# no núcleo `tezos-core` (SPEC-0001) quando a onda de custódia chegar, e a
# revisão delas é do Tezos Core & Crypto. Um teste do app reprova se alguma
# aparecer aqui antes disso.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
